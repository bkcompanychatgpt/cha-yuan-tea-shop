# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the storefront as a Render Web Service with a persistent disk for the
# SQLite database.
#
#   IMPORTANT: the disk below requires a paid instance type (Starter or above).
#   On the free plan Render offers no persistent storage, so data/shop.db would be
#   recreated empty on every deploy and every order would be lost. If you must
#   start on the free plan, see docs/DEPLOY.md for what that costs you.
#
# To use: push this repository to GitHub, then in Render choose
#   New → Blueprint → select the repository.
# Render reads this file, prompts for the values marked `sync: false`, and
# creates everything else automatically.

services:
  - type: web
    # Render identifies the service by this name, and the onrender.com hostname is
    # derived from it. It is the repository's name, not the brand: renaming it here
    # would make a blueprint sync create a *second* service rather than rename this
    # one, and the custom domain would have to be moved across. Customers only ever
    # see the domain below, so this stays as it is.
    name: cha-yuan-tea-shop
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # --include=dev is deliberate: the build script renders SVG assets and needs
    # the full dependency tree, and nothing here is pruned afterwards.
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true

    disk:
      name: cha-yuan-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT itself; the app reads it and binds to 0.0.0.0 below.
      - key: HOST
        value: 0.0.0.0

      # Behind Render's proxy, so the app must trust X-Forwarded-For to rate-limit
      # and log the real client IP.
      - key: TRUST_PROXY
        value: "1"

      # The SQLite file lives on the mounted disk so it survives deploys.
      - key: DATABASE_FILE
        value: /var/data/shop.db

      # Signs the admin session cookie. Render generates and stores this.
      - key: SESSION_SECRET
        generateValue: true

      # ------------------------------------------------ storefront identity
      - key: STORE_NAME
        value: Bridgeport Global
      - key: STORE_LOGO_SUBTITLE
        value: TEA & JEWELLERY
      - key: STORE_TAGLINE
        value: Chinese tea and beaded jewellery, bought in small lots.
      - key: CURRENCY
        value: CAD
      - key: CURRENCY_SYMBOL
        value: $
      - key: FREE_SHIPPING_THRESHOLD
        value: "79"
      - key: FLAT_SHIPPING_FEE
        value: "9.5"
      # Ontario HST, which matches the Markham registration below.
      - key: TAX_RATE
        value: "0.13"
      - key: TAX_LABEL
        value: HST (13%)

      # ------------------------------------------------- trading entity details
      # Printed on /contact, /terms, /privacy and /refund. These are the real
      # details and are declared here rather than left to be typed into the
      # dashboard, so a fresh deploy is correct without a manual step.
      #
      # The two registration numbers are deliberately absent: neither has been
      # supplied, and /contact says "To be supplied" next to them rather than
      # printing an invented number. Add them as `sync: false` entries here once
      # they exist.
      - key: COMPANY_LEGAL_NAME
        value: Bridgeport Global Inc.
      - key: COMPANY_TRADING_NAME
        value: Bridgeport Global
      # One line per address row, separated by "|".
      - key: COMPANY_ADDRESS
        value: 4-400 Esna Park Drive|Markham, Ontario L3R 3K2|Canada
      - key: COMPANY_COUNTRY
        value: Canada
      - key: COMPANY_EMAIL
        value: support@bridgeportglobalinc.com
      - key: COMPANY_PRIVACY_EMAIL
        value: privacy@bridgeportglobalinc.com
      - key: COMPANY_PHONE
        value: +1 (942) 380-9665
      - key: COMPANY_CONTACT_PERSON
        sync: false
      - key: COMPANY_HOURS
        sync: false
      - key: COMPANY_RESPONSE_TIME
        sync: false

      # -------------------------------------------------------- WhatsApp
      # The one messaging channel the shop uses. Leave both blank and nothing is
      # rendered anywhere — no button, no icon, no mention. Fill in the number
      # and the footer icon and the /contact panel appear by themselves.
      #
      # International form; spaces and punctuation are fine and are kept for the
      # label while being stripped for the wa.me link:
      #   WHATSAPP_NUMBER=+86 138 0013 8000
      - key: WHATSAPP_NUMBER
        sync: false
      # Only if you have a full link instead (a chat.whatsapp.com invite, say).
      # Takes precedence over the number.
      - key: WHATSAPP_URL
        sync: false

      # ------------------------------------------------------ OTT Pay gateway
      # `mock` needs no credentials and simulates the acquirer end to end, which
      # is the right setting for a first deploy. Switch to `sandbox`, then `live`,
      # once you have credentials and a public URL for the callback.
      - key: PAYMENT_MODE
        value: mock

      # The public hostname. The payment gateway posts its callback here, so this
      # is not cosmetic — while it names the onrender.com address, a payment can
      # complete at the gateway while the shop never hears about it.
      #
      # Leave it as `sync: false` and set it in the dashboard once the custom
      # domain is attached at Cloudflare, rather than pinning it here: the
      # onrender.com service name is not known until Render has created it, and a
      # wrong literal would be worse than an empty value.
      - key: PUBLIC_BASE_URL
        sync: false

      # Fill these in from your OTT Pay onboarding email. Leave blank while
      # PAYMENT_MODE=mock.
      - key: OTT_APP_ID
        sync: false
      - key: OTT_APP_KEY
        sync: false
      - key: OTT_SIGN_KEY
        sync: false
      - key: OTT_MERCHANT_ID
        sync: false

      # Optional: KOUNT device data collection for 3-D Secure 2.
      - key: KOUNT_CLIENT_ID
        sync: false
      - key: KOUNT_ENVIRONMENT
        value: TEST

      # --------------------------------------------------------- back office
      # Render prompts for these. They are what protect /admin, so set real
      # values — the defaults in .env.example are deliberately unusable.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
